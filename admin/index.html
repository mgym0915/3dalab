<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DAlab 控制台</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head><body>
<header><h1>3DAlab 控制台</h1><button id="logout" hidden>退出登录</button></header>
<main><form id="login"><h2 id="loginTitle">管理员登录</h2><label>管理员密码<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="confirmLabel" hidden>确认密码<input id="confirm" type="password" autocomplete="new-password" maxlength="256"></label><button id="loginButton" type="submit">登录</button><p id="loginError" role="status"></p></form>
<div id="console" hidden><div id="connection" role="status"></div><section class="status-grid"><article><span>网站服务</span><strong id="website">—</strong></article><article><span>固定隧道</span><strong id="tunnel">—</strong></article><article><span>网站版本</span><strong id="version">—</strong></article><article><span>在线人数</span><strong id="online">—</strong></article></section>
<section><h2>模块</h2><div class="table-scroll"><table><thead><tr><th>名称</th><th>模块版本</th><th>软件版本</th></tr></thead><tbody id="modules"></tbody></table></div><form id="loadForm"><input id="moduleFile" type="file" accept=".zip,application/zip" required aria-label="新版模块包"><button id="loadButton" type="submit">加载新版模块</button></form><p id="loadResult" role="status"></p></section>
<section><h2>资料编辑申请</h2><div id="documentRequests"></div></section><section><h2>在线与游戏</h2><div id="people"></div><div id="games"></div></section>
<section><div class="log-heading"><h2>日志</h2><select id="logKind" aria-label="日志类型"><option value="website">网站</option><option value="access">访问</option><option value="tunnel">隧道</option><option value="launcher">启动</option></select></div><pre id="logs"></pre></section></div></main></body></html>
