<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>干瞪眼</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script><link rel="stylesheet" href="./feature-space.css"></head><body><canvas id="table" aria-label="三维干瞪眼牌桌"></canvas><header><h1>干瞪眼</h1><div><button id="rankButton">积分榜</button><button id="leave" hidden>退出房间</button></div></header><section id="lobby"><h2>干瞪眼</h2><button id="create">创建房间</button><div><select id="aiCount" aria-label="人数"><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select><button id="practice">人机练习</button></div><form id="join"><input id="roomCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-label="房间码" placeholder="房间码" required><button>加入房间</button></form></section><section id="roomInfo" hidden><span id="roomLabel"></span><span id="deckCount"></span><span id="bombValue"></span></section><div id="players"></div><div id="status" role="status"></div><div id="actions" hidden><select id="declaration" aria-label="牌型声明" hidden></select><button id="play">出牌</button><button id="pass">过</button><button id="begin" hidden>开始</button><button id="next" hidden>下一局</button></div><dialog id="ranking"><button id="closeRanking">关闭</button><h2>干瞪眼积分榜</h2><div id="rankingRows"></div></dialog></body></html>
